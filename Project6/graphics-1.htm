<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extreme Honeymoons</title>


<style type="text/css">


	#thumbs, #image {
		width: 900px;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:500px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "/images/print.jpeg"
	PrintButton2.src = "/images/print2.jpeg"
	logo1.src = "/images/logo.jpeg"
	logo2.src = "/images/logo2.jpg"
}


		var imgArray = new Array(
			'images/logo.jpeg',
			'Image2Lg.jpg',
			'Image3Lg.jpg',
			'Image4Lg.jpg'
			

		);


		var titleArray = new Array(
			'Motorcylce',
			'Hikers',
			'Scuba Couple',
			'SKiing Couple'
			
		);
			
		var imgPath = "Images/Fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">


<div align="center">

<div>
	<a href="" onMouseOver="document.PrintButton.src='images/print2.jpeg';"
	onMouseOut="document.PrintButton.src='images/print.jpeg';">

	<img src="images/print.jpeg" width="250" height="75" 
	name="PrintButton" alt="PrintButton" style="border:none;"/>

	</a>
</div>


<div id="logo">
	<a href="images/logo.jpeg" onMouseOver="document.logo.src='images/logo2.jpeg';"
	onMouseOut="document.logo.src='images/logo.jpeg';">

	<img src="images/logo.jpeg" width="133" height="126" 
	name="logo" alt="logo" style="border:none;"/>

	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="images/MotorcycleSm.jpg" alt="Motorcycle Couple" onmouseover="swapImage(0);" />
		<img src="images/OwnersHikingSmall.jpg" alt="Hikers" onmouseover="swapImage(1);" />
		<img src="images/ScubaSmall.jpg" alt="Scubadiving" onmouseover="swapImage(2);" />
		<img src="images/SkiCoupleSm.jpg" alt="Skiing Couple" onmouseover="swapImage(3);" />
		
</div>



<img src="images/2colback.png">

<br />
<br />
<br />
<br />



</div>

</p>
  

</body>
</html>
